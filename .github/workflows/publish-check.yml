name: Publish Check

# Guards the published package's shape and types. Would have caught the 0.4.0
# type leaks (zarrita import + missing @webgpu/types) before release: publint
# validates package.json/exports, and are-the-types-wrong (ATTW) compiles the
# packed tarball as a consumer would — including strict resolution that surfaces
# leaked/unresolvable type imports.
on:
  push:
    branches-ignore:
      - main
  pull_request:

jobs:
  publish-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        # Version comes from package.json "packageManager" — don't also pass `version` here.
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build library
        run: pnpm run build:lib

      - name: Validate package (publint)
        # --pack pnpm matches the repo package manager (auto can misfire in CI).
        run: pnpm dlx publint --pack pnpm

      - name: Validate types against a consumer (are-the-types-wrong)
        # --pack packs the tarball and type-checks it the way an installer sees it.
        # esm-only: package is "type":"module" with no CJS export — ignore false-CJS noise.
        run: pnpm dlx @arethetypeswrong/cli --pack . --profile esm-only
