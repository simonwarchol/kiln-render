name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        # Version comes from package.json "packageManager" — don't also pass `version` here.
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # Landing/gallery/docs at the site root (dist/), unified viewer under dist/app/.
      # Repo-agnostic base so this is safe on BOTH remotes:
      #   - kiln-render (production, custom apex domain, not a fork): served at
      #     kilnrender.com root, so VITE_BASE = '/'.
      #   - forks / kiln-render-private (staging) / any other: no custom domain,
      #     served at <owner>.github.io/<repo>/, so VITE_BASE = '/<repo>/'.
      #
      # Build order: VitePress site owns dist/ and empties it first; the viewer
      # build then populates dist/app/ (and writes a legacy /app/multichannel/
      # redirect stub).
      - name: Build marketing site (landing / gallery / docs)
        run: pnpm run build:site
        env:
          VITE_BASE: ${{ github.event.repository.name == 'kiln-render' && github.event.repository.fork == false && '/' || format('/{0}/', github.event.repository.name) }}

      - name: Build viewer app
        run: pnpm run build
        env:
          VITE_BASE: ${{ github.event.repository.name == 'kiln-render' && github.event.repository.fork == false && '/' || format('/{0}/', github.event.repository.name) }}

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: true
          # Custom apex domain ONLY on the canonical non-fork production repo.
          # Forks named kiln-render must not publish a CNAME — that claims
          # kilnrender.com and breaks Pages domain verification / deploy.
          # peaceiris skips writing CNAME when this is empty.
          cname: ${{ github.event.repository.name == 'kiln-render' && github.event.repository.fork == false && 'kilnrender.com' || '' }}
