name: Deploy Preview

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        # Version comes from package.json "packageManager" — don't also pass `version` here.
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Extract branch name
        shell: bash
        run: echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
        id: extract_branch

      - name: Sanitize branch name for URL
        shell: bash
        run: echo "sanitized=$(echo '${{ steps.extract_branch.outputs.branch }}' | sed 's/[^a-zA-Z0-9-]/-/g' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
        id: sanitize

      # VITE_BASE is the site-root prefix; the unified viewer derives /app/ from
      # it. VitePress owns dist/ and empties it, so it builds FIRST; the viewer
      # then populates dist/app/.
      #
      # Base is domain-aware, mirroring deploy.yml:
      #   - canonical kiln-render (custom apex domain, not a fork): preview at
      #     kilnrender.com/preview/<b>/ — base = /preview/<b>/ (NO repo prefix).
      #   - forks / any other repo: <owner>.github.io/<repo>/preview/<b>/.
      # VITE_PREVIEW marks the VitePress build so it emits <meta robots=noindex>.
      - name: Build marketing site with branch-specific base
        run: pnpm run build:site
        env:
          VITE_BASE: ${{ github.event.repository.name == 'kiln-render' && github.event.repository.fork == false && format('/preview/{0}/', steps.sanitize.outputs.sanitized) || format('/{0}/preview/{1}/', github.event.repository.name, steps.sanitize.outputs.sanitized) }}
          SITE_ORIGIN: ${{ github.event.repository.name == 'kiln-render' && github.event.repository.fork == false && 'https://kilnrender.com' || format('https://{0}.github.io', github.repository_owner) }}
          VITE_REPO_URL: ${{ format('https://github.com/{0}', github.repository) }}
          VITE_PREVIEW: '1'

      - name: Build viewer app with branch-specific base
        run: pnpm run build
        env:
          VITE_BASE: ${{ github.event.repository.name == 'kiln-render' && github.event.repository.fork == false && format('/preview/{0}/', steps.sanitize.outputs.sanitized) || format('/{0}/preview/{1}/', github.event.repository.name, steps.sanitize.outputs.sanitized) }}
          VITE_REPO_URL: ${{ format('https://github.com/{0}', github.repository) }}

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: preview/${{ steps.sanitize.outputs.sanitized }}
          keep_files: true

      - name: Comment PR with preview URL
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const branchName = '${{ steps.sanitize.outputs.sanitized }}';
            const repo = '${{ github.event.repository.name }}';
            const isProd = repo === 'kiln-render' && ${{ github.event.repository.fork == false }};
            const previewUrl = isProd
              ? `https://kilnrender.com/preview/${branchName}/`
              : `https://${{ github.repository_owner }}.github.io/${repo}/preview/${branchName}/`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 Preview deployed to: ${previewUrl}`
            });
