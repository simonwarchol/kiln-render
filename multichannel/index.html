<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Redirecting…</title>
<!--
  Back-compat stub: older share links used /multichannel/ then /app/multichannel/.
  The unified viewer lives at /app/ and picks UI from channel count. Relative
  redirect so it works at the production root and under preview prefixes.
-->
<script>
  location.replace('../app/' + location.search + location.hash);
</script>
<meta http-equiv="refresh" content="0; url=../app/">
</head>
<body>
<p>The viewer has moved to <a href="../app/">/app/</a>. Redirecting…</p>
</body>
</html>
